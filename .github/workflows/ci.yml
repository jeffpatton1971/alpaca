name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Market.slnx --locked-mode
      - run: dotnet build Market.slnx --configuration Release --no-restore
      - run: dotnet test Market.slnx --configuration Release --no-build
      - run: dotnet pack src/Market.Cli/Market.Cli.csproj --configuration Release --no-build --output artifacts/packages
